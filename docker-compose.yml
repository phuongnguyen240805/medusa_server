services:
  redis:
    image: redis:7-alpine
    container_name: medusa-redis
    restart: unless-stopped
    ports:
      - "6380:6379"
    command: redis-server --requirepass "${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}" --appendonly yes
    volumes:
      - medusa_redis_data:/data

volumes:
  medusa_redis_data:
